[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymizer-modul"
version = "0.2.0"
description = "PRIVAT: Fail-closed Standalone-Anonymizer für personenbezogene Dokumente"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "ellmos / BACH Contributors"}
]

dependencies = ["cryptography>=41.0"]

[project.optional-dependencies]
docx  = ["python-docx>=1.0"]
pdf   = ["PyMuPDF>=1.22", "pikepdf>=8.0"]
excel = ["openpyxl>=3.1"]
# Generische Personennamen-Erkennung (DE+EN) fuer Drittpersonen in Fliesstext,
# die keine explizit uebergebenen Namen sind (z.B. andere Kinder in Gruppen-
# protokollen). Modelle separat laden: `python -m spacy download de_core_news_lg`
# und `python -m spacy download en_core_web_lg`.
ner   = ["spacy>=3.7"]
all   = [
    "python-docx>=1.0",
    "PyMuPDF>=1.22",
    "pikepdf>=8.0",
    "openpyxl>=3.1",
    "spacy>=3.7",
]
dev   = ["pytest>=7.0", "build>=1.2", "twine>=5.0", "ruff>=0.6"]

[project.scripts]
anonymizer = "anonymizer_modul.core:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anonymizer_modul*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
