name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run test suite
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        # ruff bewusst gepinnt: ungepinnt zieht der Job jede neue ruff-Version,
        # und ruff nimmt in Minor-Releases neue Regeln in den Default-Regelsatz
        # auf. 0.16.0 hat den Lint am 2026-07-24 so ohne Code-Aenderung rot
        # gemacht (161 Treffer, v. a. UP006/UP045/I001-Modernisierung).
        # Anhebung bewusst und zusammen mit den faelligen Fixes vornehmen.
        run: python -m pip install --upgrade pip "ruff==0.15.17"

      - name: Ruff check
        run: ruff check .

      - name: py_compile fallback (syntax gate)
        run: |
          python -m py_compile anonymizer_modul/*.py tests/*.py

  bandit:
    name: Security scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit

      - name: Bandit scan
        run: bandit -r anonymizer_modul -ll
